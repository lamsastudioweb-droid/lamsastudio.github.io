<!DOCTYPE html>
<html lang="en" dir="ltr" data-g="gta6">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three Worlds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0b2e;--panel:#2a1245;--ink:#fff1f7;--muted:#d9b8d0;--a:#ff4f9a;--b:#ffa24d;--line:#4a2a6b;--rad:0 2rem 0 2rem;color-scheme:dark;
--disp:"Bowlby One","Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
:root[data-g="fc27"]{--bg:#0a3d2a;--panel:#0f5238;--ink:#f2fff7;--muted:#a9dcc2;--a:#4dc3ff;--b:#ffffff;--line:#1f7a55;--rad:1rem}
:root[data-g="rdr2"]{--bg:#2a1710;--panel:#3b2217;--ink:#f6e7d0;--muted:#d1b392;--a:#d9822b;--b:#f0b45b;--line:#6b4330;--rad:.3rem}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.1rem;line-height:1.7;transition:background .4s}
.disp{font-family:var(--disp);font-weight:400;line-height:1.15}
:lang(ar) .disp{font-family:var(--body);font-weight:800;line-height:1.35}
a{color:inherit}
:focus-visible{outline:3px solid var(--b);outline-offset:3px}
.wrap{max-width:68rem;margin-inline:auto;padding-inline:1.25rem}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:4rem}
.logo{font-size:1.15rem}
.lang{font:inherit;font-weight:700;background:none;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:.1rem 1rem;cursor:pointer}
.lang:hover{background:var(--ink);color:var(--bg)}
.tabs{display:flex;flex-wrap:wrap;gap:.6rem;margin-block:.5rem 1rem}
.tabs button{font:inherit;font-weight:700;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:.35rem 1.3rem;cursor:pointer}
.tabs button:hover{border-color:var(--a)}
.tabs button[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:var(--bg)}
.stage{display:grid;gap:2rem;padding-block:1.5rem 2.5rem}
@media (min-width:820px){.stage{grid-template-columns:minmax(0,22rem) 1fr;gap:3.5rem}.left{position:sticky;top:1.5rem}}
.left{align-self:start}
.left h1{margin:1.4rem 0 .3rem;font-size:clamp(1.7rem,4.5vw,2.4rem)}
.tg{margin:0;font-weight:700;font-size:1.2rem;color:var(--b)}
.sq{aspect-ratio:1;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;container-type:inline-size;border-radius:var(--rad);box-shadow:8px 8px 0 var(--a);font-family:"Bowlby One",system-ui,sans-serif;line-height:.95}
.sq b{display:block;font-weight:400;font-size:4rem;font-size:30cqw}
.sq i{display:block;font-style:normal;font-size:2.6rem;font-size:20cqw}
.sq span{position:relative}
.gta{background:linear-gradient(160deg,#ff4f9a,#ffa24d);color:#1a0b2e}
.gta b{font-size:2.6rem;font-size:20cqw}
.gta i{font-size:6rem;font-size:48cqw}
.fc{background:repeating-linear-gradient(90deg,#127a4d 0 2.2rem,#0f6a43 2.2rem 4.4rem);color:#fff}
.fc::before{content:"";position:absolute;width:72%;aspect-ratio:1;border:3px solid rgba(255,255,255,.55);border-radius:50%}
.rd{background:linear-gradient(#f0b45b,#d9822b);color:#1d0f09;outline:3px dashed #1d0f09;outline-offset:-14px}
.rd b{font-size:4.4rem;font-size:34cqw}
.rd i{font-size:5.5rem;font-size:42cqw}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
h2{font-size:1.5rem;margin:0 0 .8rem}
.right h2:not(:first-child){margin-top:1.8rem}
dl{margin:0}
dt{color:var(--muted);font-size:.95rem}
dd{margin:0 0 .8rem;font-weight:700}
.right p{margin:0;max-width:36rem}
ol{list-style:none;margin:0;padding:0;border-inline-start:4px solid var(--a)}
li{padding:.2rem 1.1rem 1rem}
li b{display:block;color:var(--b)}
.right .best{background:var(--panel);border-inline-start:6px solid var(--b);padding:1rem 1.4rem;margin-top:1.8rem;font-weight:700}
footer{border-top:2px solid var(--line);padding-block:1.5rem 2rem;color:var(--muted);font-size:.95rem}
footer a{color:var(--b);font-weight:700}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
